databases:
  - name: zynth-db
    databaseName: zynth
    user: zynth

services:
  - type: web
    name: zynth-app
    runtime: node
    rootDir: .
    buildCommand: npm install && cd server && npm install && cd ../client && npm install && npm run build
    startCommand: cd server && npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: zynth-db
          property: connectionString
