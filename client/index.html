<!doctype html>
<html lang="en">
  <head>
    <!-- Blocking theme script: runs before first paint to avoid a flash.
         Light is the default; dark is used only when the user has chosen it (saved in localStorage). -->
    <script>
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (e) {}
        if (saved === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
